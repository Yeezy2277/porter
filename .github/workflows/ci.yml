name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Repository tests run against in-memory PGlite: no database service or secrets.
      - run: npm test
      # Evals replay their recorded runs (no keys) and fail the build below the floors in evals/thresholds.json.
      - run: npm run eval -- linking
      - run: npm run eval -- agent
      - run: npm run build
